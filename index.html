<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A question for you ❤️</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,800&family=Nunito:wght@800&display=swap" rel="stylesheet">

  <style>
    :root {
      --wine: #5b1230;
      --rose: #ff3d6e;
      --rose-deep: #e0245a;
      --blush: #ffe3ea;
    }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(circle at 18% 12%, #fff1f4 0, transparent 42%),
        linear-gradient(160deg, #ffd3de 0%, #ffa9bf 100%);
      color: var(--wine);
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ---------- Layout ---------- */
    .stage { position: relative; z-index: 2; }

    .question-title,
    .answer-title {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 800;
      font-size: clamp(2.6rem, 10vw, 5.2rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    /* ---------- The heart ---------- */
    .big-heart {
      font-size: clamp(5rem, 22vw, 9rem);
      line-height: 1;
      display: inline-block;
      filter: drop-shadow(0 12px 18px rgba(224, 36, 90, .35));
      animation:
        heart-drop 1s cubic-bezier(.3, 1.6, .5, 1) both,
        heartbeat 1.3s ease-in-out 1s infinite;
    }

    /* ---------- Buttons ---------- */
    .btn-yes,
    .btn-no {
      font-family: "Nunito", system-ui, sans-serif;
      font-weight: 800;
      border: 0;
      padding: .7rem 2.4rem;
      transition: font-size .3s ease, transform .15s ease, box-shadow .2s ease;
    }

    .btn-yes {
      background: var(--rose);
      color: #fff;
      font-size: 1.25rem;
      box-shadow: 0 8px 22px rgba(224, 36, 90, .45);
      animation: glow 2s ease-in-out infinite;
    }
    .btn-yes:hover, .btn-yes:focus-visible { background: var(--rose-deep); color: #fff; transform: scale(1.06); }
    .btn-yes:active { transform: scale(.97); }

    .btn-no {
      background: #fff;
      color: var(--wine);
      font-size: 1.25rem;
      box-shadow: 0 6px 16px rgba(91, 18, 48, .18);
    }
    .btn-no:hover { background: #fff; color: var(--wine); }

    /* When the No button runs away it becomes fixed and glides to a new spot */
    .btn-no.running {
      position: fixed;
      z-index: 50;
      margin: 0;
      transition: left .35s cubic-bezier(.3, 1.4, .5, 1), top .35s cubic-bezier(.3, 1.4, .5, 1);
    }

    .hint { min-height: 1.6rem; font-weight: 800; opacity: .8; }

    /* ---------- Entrance sequence (runs once on load) ---------- */
    .rise { animation: rise .7s ease both; }
    .d1 { animation-delay: .6s; }
    .d2 { animation-delay: .9s; }

    /* ---------- Answer ---------- */
    .answer { animation: pop-in .8s cubic-bezier(.3, 1.5, .5, 1) both; }
    .answer .big-heart { animation: heartbeat .9s ease-in-out infinite; }

    /* ---------- Keyframes ---------- */
    @keyframes heart-drop {
      0%   { transform: translateY(-120px) scale(.2); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.18); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.12); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(.5) rotate(-4deg); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 22px rgba(224, 36, 90, .45); }
      50%      { box-shadow: 0 8px 34px rgba(224, 36, 90, .8); }
    }

    /* Floating hearts layer */
    #hearts { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .fx-heart { position: fixed; pointer-events: none; z-index: 40; user-select: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <div id="hearts" aria-hidden="true"></div>

  <main class="container min-vh-100 d-flex align-items-center justify-content-center text-center stage">
    <div>

      <!-- The question -->
      <section id="question">
        <div class="big-heart mb-3" aria-hidden="true">❤️</div>
        <h1 class="question-title mb-5 rise d1">Do you love me?</h1>

        <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 rise d2" id="buttons">
          <button id="yesBtn" type="button" class="btn btn-yes rounded-pill">Yes 💕</button>
          <button id="noBtn" type="button" class="btn btn-no rounded-pill">No</button>
        </div>
        <p id="hint" class="hint mt-4" aria-live="polite"></p>
      </section>

      <!-- The answer -->
      <section id="answer" class="answer d-none">
        <div class="big-heart mb-3" aria-hidden="true">💖</div>
        <h2 id="answerTitle" class="answer-title mb-3">I love you too ❤️</h2>
        <p class="fs-5 fw-bold mb-0">You just made my whole day.</p>
      </section>

    </div>
  </main>

  <script>
    // ✏️ Optional: put her name here, e.g. const NAME = "Mia";
    const NAME = "";

    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const hint = document.getElementById('hint');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rand = (min, max) => Math.random() * (max - min) + min;

    if (NAME) document.getElementById('answerTitle').textContent = `I love you too, ${NAME} ❤️`;

    /* ---------- The "No" button runs away ---------- */
    const taunts = ['Nope 😜', 'Too slow!', 'Can’t catch me 💨', 'Try again!', 'Just say yes 🥺', 'Nice try 😏', 'Almost! …not really'];
    let dodges = 0;

    function dodge(event) {
      if (event) event.preventDefault();
      dodges++;

      const rect = noBtn.getBoundingClientRect();

      // First time: take the button out of the layout and pin it to where it is now
      if (!noBtn.classList.contains('running')) {
        noBtn.style.left = rect.left + 'px';
        noBtn.style.top = rect.top + 'px';
        noBtn.classList.add('running');
        void noBtn.offsetWidth; // force reflow so the next move is animated
      }

      const pad = 12;
      const maxX = window.innerWidth - rect.width - pad;
      const maxY = window.innerHeight - rect.height - pad;
      const yesRect = yesBtn.getBoundingClientRect();

      // Pick a new spot that is far from here and not on top of the Yes button
      let x, y, tries = 0;
      do {
        x = rand(pad, Math.max(pad, maxX));
        y = rand(pad, Math.max(pad, maxY));
        tries++;
      } while (
        tries < 25 && (
          Math.hypot(x - rect.left, y - rect.top) < 140 ||
          (x < yesRect.right + 10 && x + rect.width > yesRect.left - 10 &&
           y < yesRect.bottom + 10 && y + rect.height > yesRect.top - 10)
        )
      );

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';

      // Make "Yes" a little bigger every time
      yesBtn.style.fontSize = Math.min(1.25 + dodges * 0.12, 2.6) + 'rem';
      hint.textContent = taunts[(dodges - 1) % taunts.length];
    }

    // Mouse, touch and keyboard/click all trigger the escape
    noBtn.addEventListener('mouseenter', dodge);
    noBtn.addEventListener('touchstart', dodge, { passive: false });
    noBtn.addEventListener('click', dodge);

    /* ---------- Floating background hearts ---------- */
    const heartsLayer = document.getElementById('hearts');
    const symbols = ['❤️', '💕', '💗', '💖', '🌸'];

    function floatHeart() {
      const el = document.createElement('span');
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      const size = rand(16, 38);
      el.style.cssText = `position:absolute;left:${rand(0, 100)}%;bottom:-50px;font-size:${size}px;opacity:.8`;
      heartsLayer.appendChild(el);
      const drift = rand(-60, 60);
      el.animate(
        [
          { transform: 'translate(0,0) rotate(0deg)', opacity: 0 },
          { opacity: .85, offset: .15 },
          { transform: `translate(${drift}px,-${window.innerHeight + 100}px) rotate(${rand(-40, 40)}deg)`, opacity: 0 }
        ],
        { duration: rand(7000, 12000), easing: 'linear' }
      ).onfinish = () => el.remove();
    }

    if (!reduceMotion) setInterval(floatHeart, 650);

    /* ---------- Yes! ---------- */
    function burst() {
      if (reduceMotion) return;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      for (let i = 0; i < 46; i++) {
        const el = document.createElement('span');
        el.className = 'fx-heart';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = cx + 'px';
        el.style.top = cy + 'px';
        el.style.fontSize = rand(18, 44) + 'px';
        document.body.appendChild(el);

        const angle = rand(0, Math.PI * 2);
        const dist = rand(120, Math.max(window.innerWidth, window.innerHeight) * 0.6);
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        el.animate(
          [
            { transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
            { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2) rotate(${rand(-180, 180)}deg)`, opacity: 0 }
          ],
          { duration: rand(1300, 2400), easing: 'cubic-bezier(.15,.8,.3,1)' }
        ).onfinish = () => el.remove();
      }
    }

    yesBtn.addEventListener('click', () => {
      document.getElementById('question').classList.add('d-none');
      noBtn.remove();
      document.getElementById('answer').classList.remove('d-none');
      burst();
      setTimeout(burst, 700);
      if (!reduceMotion) for (let i = 0; i < 12; i++) setTimeout(floatHeart, i * 120);
    });
  </script>
</body>
</html>
